site_name: ML for Physicists by Ethan
site_description: Notes, tutorials, and worked notebooks on machine learning for physics, from first principles to applications in particle physics.
site_author: Ethan
# TODO: update these once the repo is on GitHub
site_url: https://your-github-username.github.io/ml-for-physicists/
repo_url: https://github.com/your-github-username/ml-for-physicists
repo_name: ml-for-physicists
edit_uri: edit/main/docs/

copyright: Copyright &copy; Ethan

theme:
  name: material
  font:
    text: Inter
    code: Roboto Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true
      execute: false
      ignore_h1_titles: true

nav:
  - Home: index.md
  # - Course Materials:
  #     - materials/index.md
  #     - Lectures: materials/lectures.md
  #     - Exercises: materials/exercises.md
  #     - Resources: materials/resources.md
  - Notebooks:
      - notebooks/index.md
      - "Tensors": notebooks/Tensors.ipynb
      - " Linear regression with SciKit-Learn": notebooks/Regression_Penguins_SKlearn.ipynb
      - "Linear regression with PyTorch": notebooks/Regression_Penguins_PyTorch.ipynb
      - "Classification with PyTorch": notebooks/Classification_Penguins.ipynb
      - "DNN for HEP: PyTorch": notebooks/DNN4HEP_exercise.ipynb
      - "DNN for HEP: PyTorch Lightning": notebooks/DNN4HEP_lightning.ipynb
      # - "DNN for HEP: Improved": notebooks/DNN4HEP_improved.ipynb
  - About: about.md
